name: CI

on:
  push:
  pull_request:

jobs:
  linux:
    # Software Vulkan (lavapipe): the pixel tests run with no GPU.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install Eskiu and lavapipe
        run: |
          mkdir -p $HOME/.eskiu
          curl -fsSL https://github.com/eskiu-lang/eskiu/releases/latest/download/eskiuc-linux-x86_64.tar.gz | tar -xz -C $HOME/.eskiu
          echo "$HOME/.eskiu/bin" >> $GITHUB_PATH
          sudo apt-get update
          sudo apt-get install -y mesa-vulkan-drivers libvulkan1 unzip
      - name: Tests
        run: eskiuc test
      - name: The example type-checks for iOS and Android
        run: |
          cd examples/demo && eskiuc fetch
          eskiuc src/main.esk --target arm64-apple-ios17.0 --test-typechecker
          eskiuc src/main.esk --target aarch64-linux-android26 --test-typechecker

  macos:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Install Eskiu
        run: brew install eskiu-lang/eskiu/eskiu
      - name: Tests
        run: eskiuc test
